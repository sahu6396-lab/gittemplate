<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="A modern starter template">
  <title>Document Title</title>

  <style>
    /* CSS Reset & Defaults */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header, main, footer {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    main {
      flex: 1;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6c757d;
    }

    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>
